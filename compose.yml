# Shared logging config: cap json-file logs at ~30 MB per service so they
# don't fill the host disk during long-lived deployments.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prefect"]
      interval: 5s
      timeout: 3s
      retries: 5
    init: true
    security_opt:
      - no-new-privileges:true
    # NB: postgres' entrypoint needs CHOWN/FOWNER/SETUID/SETGID during initdb
    # to set up the data directory under the postgres user. Leaving Linux
    # capabilities at default for the postgres service only -- everything
    # else in this stack drops them all.
    logging: *default-logging
    restart: unless-stopped

  chap-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      CHAP_SCHEDULER_HOST: 0.0.0.0
      CHAP_SCHEDULER_PORT: "9090"
      CHAP_SCHEDULER_EMBED_PREFECT: "true"
      CHAP_SCHEDULER_PREFECT_MOUNT_PATH: /prefect
      # Prefect server settings — read directly by the embedded Prefect app.
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_SERVER_UI_SHOW_PROMOTIONAL_CONTENT: "false"
    # Bind to loopback only -- the embedded Prefect UI is unauthenticated and
    # has powerful control-plane endpoints (trigger flows, read/edit blocks
    # holding DHIS2 credentials). For shared environments, put a reverse proxy
    # with auth in front and change this to "9090:9090" + appropriate network
    # controls.
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/prefect/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    restart: unless-stopped

  dhis2-chap-prediction:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      chap-scheduler:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PREFECT_API_URL: http://chap-scheduler:9090/prefect/api
    command: ["python", "-m", "chap_scheduler.flows.dhis2_chap_prediction"]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The worker is where unbounded growth would happen -- per-run analytics
    # payloads + the chap request body get held in memory for the lifetime
    # of the run, with no chunking. 2 GiB covers national-scale runs
    # comfortably (typical peak is well under 200 MB; see the "Scalability
    # envelope" section in docs/operations.md). Raise if you start seeing
    # OOMKills on unusually large org-unit hierarchies or long histories.
    mem_limit: 2g
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres-data:
